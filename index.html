<!doctype html><html lang="en"><head><meta charset="UTF-8"><link rel="icon" href="/favicon.ico"><meta http-equiv="Cache-control" content="no-cache"/><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/><title>VOC服务质量管理</title><style>body,html{height:100%;width:100%;overflow:hidden;color:#2c3e50!important}</style><script type="module" crossorigin src="./assets/index-7a26bd40.js"></script><link rel="stylesheet" href="./assets/index-8f4587bd.css"></head><body><div id="app" style="width:100%;height:100%;overflow:hidden"></div><script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script><script src="https://m.hnair.com/package/vender/HnairAppBridge.js"></script><script>function getParameterByName(name) {
            name = name.replace(/[[]/, '\\[').replace(/[\]]/, '\\]');
            var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            // var results = regex.exec(location.search);
            var hash = window.location.href.split('#')[1]
            const results = regex.exec(hash);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }
        const ticket = getParameterByName('ticket')
        if(ticket){
            const TIME_STAMP = '1776138826189'
            const urlTimeStamp = getParameterByName('timestamp')
            if(urlTimeStamp != TIME_STAMP){
                const url = window.location.href
                const newUrl = url.split('#')[0].split('?')[0] + '?_t=' + TIME_STAMP + '#' + url.split('#')[1]
                window.location.href = newUrl.substr(0, newUrl.indexOf('ticket')) +'ticket=' + ticket + '&timestamp=' + TIME_STAMP
            }
        }</script></body></html>
